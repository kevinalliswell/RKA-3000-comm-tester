[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rka-comm-tester"
version = "0.1.0"
description = "Read-only serial communication tester for TAIE, Azbil MFC and balances"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.8", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
rka-comm-tester = "rka_comm_tester.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rka_comm_tester._vendor" = ["VENDOR.md"]
"rka_comm_tester._vendor.azbil_mfc" = ["LICENSE-MIT"]
"rka_comm_tester._vendor.taie_temp" = ["LICENSE-APACHE-2.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["src/rka_comm_tester/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
