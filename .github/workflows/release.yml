name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rka-comm-tester-windows-x64
          path: dist/release
      - name: Verify downloaded asset checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          args=(--verify-tag --title "RKA-3000 通信测试 $tag" --notes-file docs/release-notes.md)
          if [[ "$tag" == *-* ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "$tag" dist/release/* "${args[@]}"
