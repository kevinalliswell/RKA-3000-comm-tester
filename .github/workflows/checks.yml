name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Check manifest and release tag versions
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/check_version.py --tag $env:GITHUB_REF_NAME
          } else {
            python scripts/check_version.py
          }
      - run: python -m pip install -r requirements/build.txt -e ".[dev,legacy-ui]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Freeze Python backend
        run: python scripts/build_backend.py
      - name: Verify frozen backend without serial I/O
        run: python scripts/smoke_backend.py src-tauri/binaries/rka-backend-x86_64-pc-windows-msvc.exe
      - name: Collect dependency notices
        run: python scripts/collect_notices.py
      - name: Build Windows desktop and NSIS installer
        run: npm run tauri build -- --ci --config src-tauri/tauri.release.conf.json -- --locked
      - name: Stage portable ZIP, installer and checksums
        run: python scripts/stage_release.py
      - name: Verify portable desktop lifecycle
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/portable -Recurse -Filter rka-3000-comm-tester.exe
          ./scripts/smoke_desktop.ps1 -Executable $exe.FullName
      - name: Verify install, installed desktop and uninstall
        shell: pwsh
        run: ./scripts/smoke_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rka-comm-tester-windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Save failed package for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rka-windows-failure
          path: |
            dist/release/*
            build/portable/**
          if-no-files-found: ignore
          retention-days: 3
